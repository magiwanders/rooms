<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rooms</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: pointer; }
  #hud { position: fixed; top: 10px; left: 12px; color: #d8d4c8; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
         text-shadow: 0 0 3px #000, 0 0 6px #000; pointer-events: none; white-space: pre; opacity: .85; }
  #msg { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #f3e6c4;
         font: 13px ui-monospace, Menlo, Consolas, monospace; text-shadow: 0 0 4px #000; pointer-events: none;
         transition: opacity .4s; opacity: 0; white-space: pre; line-height: 1.6; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7px 0 0 -7px; display: none; pointer-events: none;
               background: linear-gradient(#e8e2d0cc, #e8e2d0cc) center / 1px 100% no-repeat, linear-gradient(#e8e2d0cc, #e8e2d0cc) center / 100% 1px no-repeat;
               mix-blend-mode: difference; }
  #start { position: fixed; left: 0; right: 0; top: 50%; text-align: center; color: #f3e6c4; pointer-events: none;
           font: 14px ui-monospace, Menlo, Consolas, monospace; text-shadow: 0 0 4px #000, 0 0 8px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>
<div id="crosshair"></div>
<div id="start">click to capture</div>
<script type="module" src="main.js"></script>
</body>
</html>
